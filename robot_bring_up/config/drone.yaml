# MAVROS 适配器的 TEB 混合位置+速度控制调参，放在 bringup 配置中便于
# 与 teb.yaml / teb_door.yaml 的 TEB 速度上限一起维护。
# 注意：这是普通/穿门共用的水平速度模长上限，不会按当前模式自动切换；
# /cmd_vel 仍受当前 TEB 的 max_vel_x/y 限制。当前设为 0.25 m/s，与穿门
# TEB 的 max_vel_x/y=0.25 一致；普通 TEB 的 max_vel_x=0.45 会被此值进一步
# 限制。若希望普通模式也达到更高速度，需要同步调整此值并验证飞控跟踪。
mavros_adapter:
    ros__parameters:
        teb_position_velocity_feedforward_max: 0.65  # m/s；PositionTarget 水平速度前馈的向量模长限幅
        teb_position_target_speed: 0.65  # m/s；位置目标沿 TEB 路径推进的最大速度，避免低于速度前馈限额

## PCD/map 路径统一放在 config/map_paths.yaml
pcd2pgm_node:
    ros__parameters:
        method: "point" # normal、height或者point，代表不同的转换方法
        thre_x_min: -50.0 # 点云范围
        thre_x_max: 50.0 # 点云范围
        thre_y_min: -50.0 # 点云范围
        thre_y_max: 50.0 # 点云范围
        thre_z_min: -0.56 # 点云范围 point方法需要排除地面影响
        thre_z_max: 1.2 # 点云范围 point方法需要排除天花板影响
        thre_radius: 0.05 # 半径阈值，用于排除离群的点
        map_resolution: 0.02 # 地图分辨率，m
        thre_point_count: 30 # 半径内点的数量阈值，用于排除离群的点
        occupied_thresh: 0.65 # 占据阈值
        free_thresh: 0.196 # 空闲阈值
        point_num_for_normal: 50 # 用于计算法向量的点的数量
        leaf_size: 0.1 # 体素滤波器的体素大小，只与normal方法有关
        angle_threshold: 1.0 # 法向量与地面夹角的角度阈值(弧度制)，只与normal方法有关
        height_threshold: 0.05 # 高度阈值，只与height方法有关
        point_num_for_statistical: 100 # 用于统计滤波的点的数量
        standard_deviation_multiplier: 1.0 # 标准差倍数

map_server:
    ros__parameters:
        yaml_filename: "/home/echo/echo_drone_guoji_clean/robot_bring_up/maps/field_changdi_map.yaml"

obstacle_segmentation_node:
    ros__parameters:
        input_cloud_topic: "/cloud_registered_body"
        output_cloud_topic: "/cloud_obstacle"
        clearing_scan_topic: "/scan_obstacle_clear"
        output_frame: "map"
        obstacle_cell_stale_timeout_sec: 1.0 # 某障碍格连续 1 秒未出现在障碍点云中即清除
        clear_ray_max_range: 10.0
        clear_grid_resolution: 0.05
        tf_wait_timeout_sec: 3.0 # 点云先到时按原时间戳等 TF；超时丢帧，不用最新 TF 猜测
        max_pending_clouds: 40 # 有界队列；约覆盖 4 秒的 10 Hz 点云
        clearing_max_cloud_age_sec: 0.5 # 迟到点云仍可标记障碍，但不允许用旧扫描清理代价地图
        use_downsample: true # 是否使用体素滤波器
        leaf_size: 0.25 # 体素滤波器的体素大小
        point_num_for_normal: 10 # 用于计算法向量的点的数量
        angle_threshold: 0.785 # 法向量与地面夹角的角度阈值(绝对值、弧度制)
        obstacle_x_min: -10.0 # 障碍物的x最小值(livox坐标系)
        obstacle_x_max: 10.0 # 障碍物的x最大值(livox坐标系)
        obstacle_y_min: -10.0 # 障碍物的y最小值(livox坐标系)
        obstacle_y_max: 10.0 # 障碍物的y最大值(livox坐标系)
        obstacle_z_min: 0.2 # map系离地高度下限；低于此值视为地面回波
        obstacle_z_max: 2.0 # map系障碍物高度上限
        obstacle_above_sensor_max_m: 0.4 # 高于雷达原点40cm及以上的回波不作为障碍物
        obstacle_range_min: 0.2 # 障碍物的最近距离(livox坐标系)
        obstacle_range_max: 10.0 # 障碍物的最远距离(livox坐标系)
        # 在 Point-LIO 输入云的机体/IMU坐标系中过滤机身自身回波；只删除此紧凑 3D 盒内的点。
        # 默认范围是初始估计，需用 /cloud_registered_body 的点云和机架尺寸核实后再收紧/放宽。
        body_min_x: -0.30
        body_max_x: 0.30
        body_min_y: -0.25
        body_max_y: 0.25
        body_min_z: -0.25
        body_max_z: 0.15

