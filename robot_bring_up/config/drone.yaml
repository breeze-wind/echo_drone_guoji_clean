laser_mapping:
    ros__parameters:
        common:
            lid_topic:  "/livox/lidar"
            imu_topic:  "/livox/imu"
            odom_topic: "/Odometry"
            con_frame: false # true: if you need to combine several LiDAR frames into one
            con_frame_num: 2 # the number of frames combined
            cut_frame: false # true: if you need to cut one LiDAR frame into several subframes
            cut_frame_time_interval: 0.1 # should be integral fraction of 1 / LiDAR frequency
            time_lag_imu_to_lidar: 0.0 # Time offset between LiDAR and IMU calibrated by other algorithms, e.g., LI-Init (find in Readme)
            # the timesample of IMU is transferred from the current timeline to LiDAR's timeline by subtracting this value
            map_frame: "odom"
            odom_frame: "livox_raw"

        preprocess:
            lidar_type: 1
            scan_line: 4
            scan_rate: 10
            timestamp_unit: 3
            blind: 0.24

        mapping:
            imu_en: true
            initialize_time_threshold: 1000 #在启动时的前n次处理时不把点云加入ikdtree地图，使程序用扫到的点云与先验点云匹配，寻找正确的位姿。n次后开始增量更新，扫到的点云加入ikdtree，先验点云失效  
            start_in_aggressive_motion: false
            extrinsic_est_en: false
            imu_time_inte: 0.005
            satu_acc: 3.0
            satu_gyro: 35.
            acc_norm: 1.0
            lidar_meas_cov: 0.001
            acc_cov_output: 500.
            gyr_cov_output: 1000.
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            imu_meas_acc_cov: 0.1
            imu_meas_omg_cov: 0.1
            gyr_cov_input: 0.01
            acc_cov_input: 0.1
            plane_thr: 0.1
            match_s: 81.0
            fov_degree: 360.
            det_range: 450.0
            gravity_align: false
            gravity: [0.0, 0.0, -0.9810]
            gravity_init: [0.0, 0.0, -0.9810]
            extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
            extrinsic_R: [  1., 0., 0.,
                            0., 1., 0.,
                            0., 0., 1.]
        odometry:
            publish_odometry_without_downsample: false
        publish:
            path_en: false #
            scan_publish_en: true
            scan_bodyframe_pub_en: true

        pcd_save:
            use_pcd_map_: false
            prior_PCD_map_path: "/home/echo/echo_drone_guoji_clean/Point-LIO/PCD/2026_10_07_19_54_05_1.pcd" # Set to an existing .pcd path when using a prior map.
            pcd_save_en: false #建图第一步
            interval: 900
        #RMUC
        init_pos:
            init_trans: [0.0, 0.0, 0.0]
            initial_rot: [0.0, 0.0, 0.0, 1.0]
        gcl:
            task: "A"
            angle_threshold: 0.785 # 法向量与地面夹角的角度阈值(绝对值、弧度制)
        runtime_pos_log_enable: false

# teb控制器
controller_server:
    ros__parameters:
        odom_topic: "/Odometry"
        controller_frequency: 10.0 # 运行控制器的频率 (赫兹)。实机低负载模式先用 8Hz。
        controller_plugin_types: ["teb_local_planner::TebLocalPlannerROS"]
        progress_checker_plugins: ["progress_checker"]
        goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
        controller_plugins: ["FollowPath"]
        progress_checker:
            plugin: "nav2_controller::SimpleProgressChecker"
            required_movement_radius: 0.03
            movement_time_allowance: 30.0
        general_goal_checker:
            stateful: True
            plugin: "nav2_controller::SimpleGoalChecker"
            xy_goal_tolerance: 0.1
            yaw_goal_tolerance: 6.28
local_costmap:
    local_costmap:
        ros__parameters:
            update_frequency: 5.0
            publish_frequency: 2.0
            global_frame: map
            robot_base_frame: livox
            rolling_window: True
            width: 5
            height: 5
            resolution: 0.05
            footprint: "[ [0.10, 0.10], [-0.10, 0.10], [-0.10, -0.10], [0.10, -0.10] ]"
            plugins: ["static_layer", "obstacle_layer", "manual_costmap", "inflation_layer", "manual_costmap_override"]
            static_layer:
                plugin: "nav2_costmap_2d::StaticLayer"
                map_subscribe_transient_local: True
            obstacle_layer:
                plugin: "nav2_costmap_2d::ObstacleLayer"
                enabled: True
                observation_sources: scan1 clear_scan
                min_obstacle_height: 0.0
                max_obstacle_height: 2.0
                scan1:
                    topic: "/cloud_obstacle"
                    # Points are published in map; raytracing must still start
                    # at the LiDAR/IMU origin, not at the map origin.
                    sensor_frame: "livox_raw"
                    expected_update_rate: 5.0
                    max_obstacle_height: 2.0 # map系高度上限；相对机高的40cm过滤由点云分割节点负责
                    min_obstacle_height: 0.0 # 障碍物最小高度
                    # Marking data is the obstacle cloud; stale cells are cleared
                    # after the configured no-hit timeout via clear_scan.
                    clearing: False
                    marking: True
                    data_type: "PointCloud2"
                    raytrace_max_range: 6.0
                    raytrace_min_range: 0.1
                    obstacle_max_range: 6.0
                    obstacle_min_range: 0.1
                clear_scan:
                    topic: "/scan_obstacle_clear"
                    sensor_frame: "livox_raw"
                    expected_update_rate: 5.0
                    data_type: "LaserScan"
                    marking: False
                    clearing: True
                    min_obstacle_height: -10.0
                    max_obstacle_height: 10.0
                    raytrace_max_range: 6.0
                    raytrace_min_range: 0.1
            manual_costmap:
                plugin: "manual_costmap::ManualCostmapLayer"
                enabled: True
            inflation_layer:
                plugin: "nav2_costmap_2d::InflationLayer"
                cost_scaling_factor: 8.0
                inflation_radius: 0.7
            manual_costmap_override:
                plugin: "manual_costmap::ManualCostmapLayer"
                enabled: True
            always_send_full_costmap: True # RViz 需要稳定看到 /local_costmap/costmap；频率已降到 2Hz。

global_costmap:
    global_costmap:
        ros__parameters:
            update_frequency: 2.0
            publish_frequency: 1.0
            global_frame: map
            robot_base_frame: livox
            footprint: "[ [0.10, 0.10], [-0.10, 0.10], [-0.10, -0.10], [0.10, -0.10] ]"
            resolution: 0.05
            track_unknown_space: true
            plugins: ["static_layer", "obstacle_layer", "manual_costmap", "inflation_layer", "manual_costmap_override"]
            static_layer:
                plugin: "nav2_costmap_2d::StaticLayer"
                map_subscribe_transient_local: True
            obstacle_layer:
                plugin: "nav2_costmap_2d::ObstacleLayer"
                enabled: True
                observation_sources: scan1 clear_scan
                min_obstacle_height: 0.0
                max_obstacle_height: 2.0
                scan1:
                    topic: "/cloud_obstacle"
                    # Points are published in map; raytracing must still start
                    # at the LiDAR/IMU origin, not at the map origin.
                    sensor_frame: "livox_raw"
                    expected_update_rate: 5.0
                    max_obstacle_height: 2.0 # map系高度上限；相对机高的40cm过滤由点云分割节点负责
                    min_obstacle_height: 0.0 # 障碍物最小高度
                    clearing: False
                    marking: True
                    data_type: "PointCloud2"
                    raytrace_max_range: 10.0
                    raytrace_min_range: 0.1
                    obstacle_max_range: 10.0
                    obstacle_min_range: 0.1
                clear_scan:
                    topic: "/scan_obstacle_clear"
                    sensor_frame: "livox_raw"
                    expected_update_rate: 5.0
                    data_type: "LaserScan"
                    marking: False
                    clearing: True
                    min_obstacle_height: -10.0
                    max_obstacle_height: 10.0
                    raytrace_max_range: 6.0
                    raytrace_min_range: 0.1
            manual_costmap:
                plugin: "manual_costmap::ManualCostmapLayer"
                enabled: True
            inflation_layer:
                plugin: "nav2_costmap_2d::InflationLayer"
                cost_scaling_factor: 5.0
                inflation_radius: 0.8
            manual_costmap_override:
                plugin: "manual_costmap::ManualCostmapLayer"
                enabled: True
            always_send_full_costmap: True # RViz 需要稳定看到 /global_costmap/costmap；频率已降到 1Hz。

planner_server:
    ros__parameters:
        expected_planner_frequency: 2.0
        planner_plugins: ["GridBased"]
        GridBased:
            plugin: "nav2_navfn_planner/NavfnPlanner"
            tolerance: 0.5 # 请求的目标姿态和路径末端之间的公差 (米)。
            use_astar: true # 是否使用A*。如果错误，则使用Dijkstra的扩展。
            allow_unknown: true # 是否允许在未知空间进行规划。
            use_final_approach_orientation: true # 如果为true，则由planner产生的路径的最后姿态将其方向设置为进近方向，即连接路径最后两点的向量的方向

recoveries_server:
    ros__parameters:
        costmap_topic: local_costmap/costmap_raw
        footprint_topic: local_costmap/published_footprint
        cycle_frequency: 20.0
        recovery_plugins: ["spin", "back_up", "wait"]
        spin:
            plugin: "nav2_recoveries/Spin"
        back_up:
            plugin: "nav2_recoveries/BackUp"
        wait:
            plugin: "nav2_recoveries/Wait"
        global_frame: map
        robot_base_frame: livox
        transform_timeout: 0.1
        simulate_ahead_time: 2.0
        max_rotational_vel: 1.0
        min_rotational_vel: 0.4
        rotational_acc_lim: 3.2

waypoint_follower:
    ros__parameters:
        loop_rate: 50
        stop_on_failure: false
        waypoint_task_executor_plugin: "wait_at_waypoint"
        wait_at_waypoint:
            plugin: "nav2_waypoint_follower::WaitAtWaypoint"
            enabled: True
            waypoint_pause_duration: 200
